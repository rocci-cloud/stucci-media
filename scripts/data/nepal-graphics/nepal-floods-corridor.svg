<circle cx="1192" cy="600" r="17" fill="#5E6470" opacity="0.16"/>
<circle cx="1192" cy="600" r="8" fill="#0C0F14" stroke="#7C8593" stroke-width="3.5"/>
<line x1="1192" y1="584" x2="1192" y2="548"
