<!-- headline figures, on a lifted card so they read at thumbnail size -->
<g filter="url(#drop)">
  <rect x="72" y="654" width="1456" height="120" rx="4" fill="url(#card)"/>
  <rect x="72" y="654" width="1456" height="3" fill="url(#rule)"/>
</g>

<text x="132" y="716" font-family="Oswald" font-size="46" font-weight="700"
  letter-spacing="-0.4" fill="#F04458">676</text>
<text x="132" y="748" font-family="Archivo SemiBold" font-size="15"
  letter-spacing="2.2" fill="#8E97A5">CONFIRMED DEAD</text>
<rect x="378" y="682" width="1" height="66" fill="#262B34"/>
<text x="420" y="716" font-family="Oswald" font-size="46" font-weight="700"
  letter-spacing="-0.4" fill="#F04458">~3,000</text>
<text x="420" y="748" font-family="Archivo SemiBold" font-size="15"
